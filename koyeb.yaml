app: help-desk
services:
  - name: web
    type: web
    git:
      repository: github.com/SiddhuKalvi/help-desk
      branch: main
      builder: docker
      docker:
        dockerfile: Dockerfile
    instance_type: nano
    regions:
      - fra
    ports:
      - port: 3001
        path: /
        protocol: http
    routes:
      - path: /
        port: 3001
    health_checks:
      - path: /api/health
        port: 3001
        protocol: http
        interval: 30
        timeout: 5
